<!DOCTYPE html>
<html lang="ro">
<head>

<meta name="robots" content="noindex, follow">

<style>

  a.btn{display:inline-block;background:#C94A1B;color:#fff;text-decoration:none;font-weight:600;padding:14px 30px;border-radius:50px;transition:transform .25s}
  a.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <h2>Aceasta pagina nu exista</h2>
